<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Impressions Pitch — 起始音 A/B 診斷</title><link rel="stylesheet" href="../../css/common.css"><link rel="stylesheet" href="../../css/impressions.css"><style>body{padding:16px;background:#17171d;color:#eee7fb}main{max-width:1000px;margin:auto}h1{font-size:1.35rem}p{line-height:1.65}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-block:16px}.toolbar button{min-height:44px}input{max-width:150px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:20px}.candidate{min-width:0;padding:12px;border:1px solid #574366;border-radius:12px}.candidate h2{font-size:1.05rem}.candidate-wheels{display:grid;grid-template-columns:repeat(var(--notes),minmax(0,1fr));gap:8px}.candidate .impressions-wheel-value{font-size:1.2rem}.candidate button{min-height:40px}.metrics{font-size:.8rem;font-variant-numeric:tabular-nums}#details{overflow-wrap:anywhere}.selected{background:#c0b0fa!important;color:#21182c!important}@media(max-width:680px){.comparison{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><h1>音高起始值：440 Hz／參考音比較</h1><p>僅供開發診斷，無 Firebase。正式遊戲仍從 440 Hz 開始。兩組使用同一題、同一計分與正式輪盤控制。數學上的調整距離不代表真人操作或記憶表現。</p><div class="toolbar"><label>題目種子 <input type="number" id="seed" min="0" max="4294967295" value="42"></label><button class="btn" id="generate">產生此題</button><button class="btn" id="random">隨機另一題</button><button class="btn" id="sound">啟用診斷聲音並試聽</button><span id="sound-status" role="status"></span></div><div class="toolbar" role="group" aria-label="調整模式"><button class="btn selected" id="coarse" aria-pressed="true">粗調</button><button class="btn" id="fine" aria-pressed="false">細調</button><button class="btn" id="reference">播放固定參考音</button><button class="btn" id="stop">停止</button></div><p id="question-info"></p><p>輪盤為相對 220 Hz 的音分，另列實際 Hz。粗調維持正式靈敏度；細調相當於 Shift。切換不改變答案。</p><div class="comparison"><section class="candidate" id="current"><h2>A：固定 440 Hz</h2><p class="metrics"></p><div class="candidate-wheels"></div><div class="toolbar"><button class="btn play">播放目前音序</button><button class="btn reset">重設這組</button></div><p class="grade"></p></section><section class="candidate" id="reference-mode"><h2>B：已知的固定參考音</h2><p class="metrics"></p><div class="candidate-wheels"></div><div class="toolbar"><button class="btn play">播放目前音序</button><button class="btn reset">重設這組</button></div><p class="grade"></p></section></div><details id="details"><summary>診斷：原音、初始距離與分數</summary><button class="btn" id="target">播放目標音序</button><pre id="report"></pre></details><p>參考音起始僅使用已公開的鎖定音。它可能減少部分題目的調整距離，也可能讓玩家採用不同策略；需要同題 A/B 真人試玩後再決定是否正式採用。</p></main>
